<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b0b7c3"/>
      <stop offset="100%" stop-color="#717d91"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#b80012"/>
    </linearGradient>
    <linearGradient id="darkPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242b35"/>
      <stop offset="100%" stop-color="#14171d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon: Spiral Vent Blade & Air Vortex -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex/Octagon Ring -->
    <circle cx="50" cy="50" r="46" fill="url(#darkPlate)" stroke="url(#metalGrad)" stroke-width="2.5" />
    <circle cx="50" cy="50" r="40" fill="none" stroke="#2d3748" stroke-width="1.5" stroke-dasharray="4 3" />
    
    <!-- Red Accent Arc -->
    <path d="M 50 10 A 40 40 0 0 1 90 50" fill="none" stroke="url(#redGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 50 90 A 40 40 0 0 1 10 50" fill="none" stroke="url(#redGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Spiral Blades -->
    <g transform="translate(50,50)">
      <path d="M 0 0 C 10 -20, 25 -22, 28 -5 C 22 -3, 10 -2, 0 0 Z" fill="url(#metalGrad)"/>
      <path d="M 0 0 C 20 10, 22 25, 5 28 C 3 22, 2 10, 0 0 Z" fill="url(#metalGrad)"/>
      <path d="M 0 0 C -10 20, -25 22, -28 5 C -22 3, -10 2, 0 0 Z" fill="url(#metalGrad)"/>
      <path d="M 0 0 C -20 -10, -22 -25, -5 -28 C -3 -22, -2 -10, 0 0 Z" fill="url(#metalGrad)"/>
      
      <!-- Central Hub / Spiral Core -->
      <circle cx="0" cy="0" r="9" fill="#111317" stroke="url(#metalGrad)" stroke-width="2"/>
      <circle cx="0" cy="0" r="4.5" fill="url(#redGrad)"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(125, 20)">
    <!-- Primary Brand Name -->
    <text x="0" y="46" font-family="'Vazirmatn', 'Peyda', 'Yekan Bakh', 'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="-0.5">
      تهویه <tspan fill="url(#redGrad)">تبریز</tspan>
    </text>
    
    <!-- Subtitle / English and Tagline -->
    <text x="2" y="76" font-family="'Vazirmatn', 'Segoe UI', Tahoma, sans-serif" font-weight="600" font-size="14.5" fill="#9ca3af" letter-spacing="0.2">
      کانال تهویه تبریز • تجهیزات تخصصی تهویه و کانال‌سازی
    </text>
  </g>
</svg>
